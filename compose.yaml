name: finreg-practice

services:
  app:
    # 改成你在 GitHub Actions 中发布的镜像地址
    image: ghcr.io/yourname/finreg-practice:latest
    restart: unless-stopped
    init: true
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
