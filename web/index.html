<!doctype html>
<html lang="zh-CN" data-type="software">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#315c46" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta
      name="description"
      content="知序，个人金融监管备考工作台。专项练习、真题、错题复习与学习记录，都保存在本地。"
    />
    <title>知序 · 金融监管备考</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23315c46'/%3E%3Cpath d='M12 14h24L12 34h24' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="知序，学习中心"
        ><span class="brand-mark">知</span
        ><span>知序<small>金融监管备考</small></span></a
      >
      <div class="sidebar-label">学习空间</div>
      <nav aria-label="主导航">
        <a href="#home" data-route="home" data-icon="home">学习中心</a>
        <a href="#library" data-route="library" data-icon="book">我的题库</a>
        <a href="#review" data-route="review" data-icon="bookmark">错题收藏</a>
        <a href="#stats" data-route="stats" data-icon="chart">学习统计</a>
        <a href="#data" data-route="data" data-icon="database">数据管理</a>
      </nav>
      <div class="sidebar-foot">
        <span class="dot"></span>本地学习档案<small
          >题目与记录，留在你的电脑。</small
        >
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="breadcrumb">
          我的备考空间 <span>/</span> <strong id="route-name">学习中心</strong>
        </div>
        <div>
          <span class="local-chip"><span class="dot"></span>本地运行</span
          ><time id="today"></time>
        </div>
      </header>
      <main id="app" tabindex="-1" aria-label="学习工作区">
        <div class="empty">正在载入题库…</div>
      </main>
      <footer class="footnote">
        <span>知序 · 每一次练习，都有迹可循</span
        ><span>本地保存 · 来源可追溯</span>
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-label="题目与练习详情"></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
